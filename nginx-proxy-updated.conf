user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

stream {
    # Определяем upstream серверы для AI API
    upstream openai_api {
        server api.openai.com:443;
    }

    upstream anthropic_api {
        server api.anthropic.com:443;
    }

    upstream huggingface_api {
        server huggingface.co:443;
    }

    upstream huggingface_inference {
        server api-inference.huggingface.co:443;
    }

    # CDN домены HuggingFace для загрузки моделей
    upstream huggingface_cdn_lfs {
        server cdn-lfs.huggingface.co:443;
    }

    upstream huggingface_cdn_lfs_us {
        server cdn-lfs-us-1.huggingface.co:443;
    }

    upstream huggingface_cdn {
        server cdn.huggingface.co:443;
    }

    # Карта для выбора upstream по SNI hostname
    map $ssl_preread_server_name $upstream {
        api.openai.com                  openai_api;
        api.anthropic.com               anthropic_api;
        huggingface.co                  huggingface_api;
        api-inference.huggingface.co    huggingface_inference;
        cdn-lfs.huggingface.co          huggingface_cdn_lfs;
        cdn-lfs-us-1.huggingface.co     huggingface_cdn_lfs_us;
        cdn.huggingface.co              huggingface_cdn;
        default                         openai_api;
    }

    # Логирование для отладки
    log_format proxy '$remote_addr [$time_local] '
                     '$protocol $status $bytes_sent $bytes_received '
                     '$session_time "$ssl_preread_server_name"';

    access_log /var/log/nginx/stream-access.log proxy;

    # Прокси сервер
    server {
        listen 443;
        ssl_preread on;
        proxy_pass $upstream;
        proxy_connect_timeout 60s;
        proxy_timeout 600s;
        proxy_buffer_size 16k;
    }
}
